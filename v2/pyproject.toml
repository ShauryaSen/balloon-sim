[project]
name = "balloongym"
version = "0.2.0"
description = "Stratospheric balloon control environments: real wind, realistic forecasts, Gymnasium and JAX APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "numpy",
    "gymnasium>=1.0",
    "optax>=0.2.8",
    "opensimplex>=0.4.5.1",  # the simulator's BLE-style simplex error model (sim/degrade.py)
    "numba>=0.68.1",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
gpu = ["jax[cuda12]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balloongym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
extend-exclude = ["balloongym/sim", "tests/sim"]  # the simulator, kept exactly as balloon_sim has it
