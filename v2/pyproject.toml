[project]
name = "balloongym"
version = "0.1.0"
description = "Stratospheric balloon control environments: real wind, realistic forecasts, Gymnasium and JAX APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "numpy",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
render = ["matplotlib"]
dev = ["pytest", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balloongym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
