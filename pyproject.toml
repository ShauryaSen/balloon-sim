[project]
name = "balloon-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "numpy",
    "optax>=0.2.8",
    "matplotlib>=3.9",
    "opensimplex>=0.4.5.1",
    "numba>=0.68.1",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]"]  # Unicorn's dean GPUs (driver 570): uv run --extra gpu ...

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balloon_sim"]
